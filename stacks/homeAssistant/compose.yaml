  services:
    homeassistant:
      container_name: homeassistant
      image: "ghcr.io/home-assistant/home-assistant:stable"
      volumes:
        - /homelab/stacks/homeAssistant
        - /etc/localtime:/etc/localtime:ro
        - /run/dbus:/run/dbus:ro
      restart: unless-stopped
      stop_grace_period: 60s
      privileged: true
      network_mode: host
      environment:
        TZ: Europe/Amsterdam