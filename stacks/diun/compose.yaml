# Diun: tells you when newer image tags exist. Notifies only; never updates anything.
#
# Because tags are pinned, Diun is what surfaces new versions. Each service carries
# diun.* labels (watch_repo + a version regex) so Diun scans the repo for newer tags,
# not just the digest of the pinned one.
#
# It does nothing useful until a notifier is configured: add DIUN_NOTIF_* values to .env
# (see .env.example). Expect a burst of "new image found" messages on the first run.
services:
  diun:
    image: crazymax/diun:4.33.0
    container_name: diun
    restart: unless-stopped
    command: serve
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-America/Detroit}
      LOG_LEVEL: info
      LOG_JSON: "false"
      DIUN_WATCH_WORKERS: "5"
      DIUN_WATCH_SCHEDULE: "0 */6 * * *"
      DIUN_WATCH_JITTER: 30s
      DIUN_PROVIDERS_DOCKER: "true"
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: "true"
    volumes:
      # Effectively root on the host. LAN/tailnet only.
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/appdata/diun:/data
    mem_limit: 128m
    labels:
      diun.watch_repo: "true"
      diun.include_tags: '^\d+\.\d+\.\d+$$'
      diun.sort_tags: semver
      diun.max_tags: "5"
